<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLIK-PBJ SIMEULUE</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b132b] text-slate-100 min-h-screen">

    <!-- MODAL 1: OTENTIKASI PIN TIM PBJ -->
    <div id="modalPinTim" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-[#182238] border border-amber-500/30 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl relative text-slate-100">
            <button onclick="tutupModalPin()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors cursor-pointer">
                <i class="fas fa-times text-xl"></i>
            </button>
            
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0 text-lg">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div>
                    <h3 class="text-base font-bold text-amber-400 uppercase tracking-wide">PORTAL JAWAB TIM PBJ</h3>
                    <p id="subJudulPinBidang" class="text-xs text-slate-400 font-medium">Bidang: Barang</p>
                </div>
            </div>

            <div class="space-y-4 text-xs">
                <div>
                    <label class="block font-semibold text-slate-200 mb-1.5">Masukkan PIN Otentikasi Tim:</label>
                    <input type="password" id="inputPinAkses" placeholder="Masukkan PIN Bidang..." class="w-full bg-[#0b132b] border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 text-sm">
                    <p id="pesanPinSalah" class="text-red-400 text-[11px] mt-1.5 hidden flex items-center gap-1">
                        <i class="fas fa-circle-exclamation"></i> PIN salah, silakan coba lagi.
                    </p>
                </div>
                <button onclick="verifikasiPinDanBukaForm()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3 rounded-xl text-xs transition-all cursor-pointer">
                    Verifikasi PIN
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: PORTAL JAWAB TIM PBJ (SETELAH PIN BENAR) -->
    <div id="modalJawabTim" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-[#182238] border border-amber-500/30 rounded-2xl max-w-xl w-full p-6 space-y-4 shadow-2xl relative text-slate-100">
            <button onclick="tutupModalJawab()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors cursor-pointer">
                <i class="fas fa-times text-xl"></i>
            </button>

            <h3 id="modalJawabBidangTitle" class="text-lg font-bold text-amber-400">Daftar Tiket</h3>
            <div id="kontenDaftarJawab" class="space-y-3 max-h-96 overflow-y-auto">
                <p class="text-xs text-slate-400">Tidak ada tiket yang perlu dijawab saat ini.</p>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIK & INTEGRASI -->
    <script>
        const SPREADSHEET_URL = "https://script.google.com/macros/s/AKfycbzayOIao3-SdZ0j2yWWL0Bh8a-uL9t1UrjAucpOTPcpPNZH_l82D68GI4AH7G2Xo7RC/exec";

        // Daftar PIN Khusus Masing-Masing Sub-Judul / Bidang
        const PIN_BIDANG = {
            "Barang": "adminbarang",
            "Jasa Konstruksi": "adminkonstruksi",
            "Jasa Konsultansi": "adminkonsultasi",
            "Jasa Lainnya": "adminjasalain",
            "Pasca Kontrak": "adminpascakontrak"
        };

        let dataTiketGlobal = [];
        let bidangAktifTerpilih = "";

        // 1. MODAL BUAT TIKET
        function bukaModalBuat(bidang) {
            const modal = document.getElementById('modalBuatTiket');
            if (modal) {
                modal.classList.remove('hidden');
                document.getElementById('inputBidang').value = bidang;
                document.getElementById('modalTitleForm').innerText = 'FORMULIR PENGAJUAN KONSULTASI: ' + bidang.toUpperCase();
            }
        }

        function tutupModalBuat() {
            const modal = document.getElementById('modalBuatTiket');
            if (modal) modal.classList.add('hidden');
        }

        // 2. MODAL OTENTIKASI PIN TIM PBJ
        function bukaModalPin(bidang) {
            bidangAktifTerpilih = bidang;
            document.getElementById('subJudulPinBidang').innerText = 'Bidang: ' + bidang;
            document.getElementById('inputPinAkses').value = '';
            document.getElementById('pesanPinSalah').classList.add('hidden');
            document.getElementById('modalPinTim').classList.remove('hidden');
        }

        function tutupModalPin() {
            document.getElementById('modalPinTim').classList.add('hidden');
        }

        // VERIFIKASI PIN SESUAI BIDANG YANG DIKLIK
        function verifikasiPinDanBukaForm() {
            const pinInput = document.getElementById('inputPinAkses').value;
            const pesanError = document.getElementById('pesanPinSalah');
            
            // Mengambil PIN resmi yang sesuai dengan bidang aktif yang dipilih
            const pinResmi = PIN_BIDANG[bidangAktifTerpilih];

            if (pinInput === pinResmi) {
                tutupModalPin();
                bukaModalJawab(bidangAktifTerpilih);
            } else {
                pesanError.innerText = `PIN untuk bidang ${bidangAktifTerpilih} salah!`;
                pesanError.classList.remove('hidden');
            }
        }

        // 3. MODAL JAWAB TIM PBJ
        function bukaModalJawab(bidang) {
            document.getElementById('modalJawabBidangTitle').innerText = 'Daftar Tiket: ' + bidang;
            document.getElementById('modalJawabTim').classList.remove('hidden');
            renderDaftarJawab(bidang);
        }

        function tutupModalJawab() {
            document.getElementById('modalJawabTim').classList.add('hidden');
        }

        function renderDaftarJawab(bidang) {
            const container = document.getElementById('kontenDaftarJawab');
            if (container) {
                container.innerHTML = `<p class="text-xs text-slate-400">Menampilkan daftar konsultasi untuk bidang ${bidang}.</p>`;
            }
        }
    </script>
</body>
</html>
